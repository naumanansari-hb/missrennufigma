<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrator Login – Miss Rennu Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark: #F8F9FC;
      --bg-radial: radial-gradient(circle at 10% 20%, rgba(245, 247, 250, 1) 0%, rgba(235, 240, 247, 1) 90%);
      --bg-card: rgba(255, 255, 255, 0.75);
      --bg-card-hover: rgba(255, 255, 255, 0.95);
      --border-color: rgba(27, 44, 110, 0.08);
      --border-hover: rgba(27, 44, 110, 0.18);

      --accent-admin: #4F46E5;
      --accent-admin-rgb: 79, 70, 229;

      --navy: #1B2C6E;
      --navy-dark: #111D4A;
      --gold: #F5A623;
      --white: #FFFFFF;
      --text: #1E293B;
      --text-muted: #5A6178;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--bg-dark);
      background-image: var(--bg-radial);
      background-attachment: fixed;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }

    /* Background Interactive Canvas */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* Ambient Glow Spots (Crimson Glows) */
    .ambient-glow-1 {
      position: absolute;
      top: 10%;
      left: -10%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--accent-admin-rgb), 0.1) 0%, rgba(var(--accent-admin-rgb), 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow-2 {
      position: absolute;
      bottom: 10%;
      right: -10%;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 166, 35, 0.08) 0%, rgba(245, 166, 35, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top Navigation Header */
    .top-nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 24px 48px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      z-index: 100;
    }

    /* Back Home Button */
    .back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--navy);
      font-weight: 600;
      font-size: 0.8rem;
      text-decoration: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 12px rgba(27, 44, 110, 0.04);
      transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
    }

    .back-home-btn:hover {
      border-color: var(--accent-admin);
      transform: translateX(-3px);
      box-shadow: 0 6px 16px rgba(27, 44, 110, 0.08);
    }

    .back-home-btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.25s;
    }

    /* Split Container Layout */
    .split-container {
      width: 100%;
      max-width: 1100px;
      margin: 40px auto 0;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 36px;
      align-items: center;
      z-index: 10;
    }

    /* Left Pane - Friendly Administrative Overview Dashboard */
    .display-pane {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 45px rgba(27, 44, 110, 0.04);
      position: relative;
    }

    .kicker-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-admin);
      background: rgba(79, 70, 229, 0.08);
      border: 1px solid rgba(79, 70, 229, 0.18);
      padding: 4px 10px;
      border-radius: 9999px;
      align-self: flex-start;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.02);
    }

    .kicker-pill svg {
      color: var(--accent-admin);
    }

    .display-header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.4rem, 2.5vw, 1.8rem);
      line-height: 1.2;
      color: var(--navy);
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .display-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
      border-left: 3px solid var(--accent-admin);
      padding-left: 12px;
    }

    /* Friendly SaaS-style mock dashboard container */
    .admin-mock-panel {
      background: var(--white);
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(27, 44, 110, 0.08), 0 0 30px rgba(79, 70, 229, 0.03);
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      position: relative;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--navy);
    }

    .panel-badge {
      font-size: 0.6rem;
      background: rgba(79, 70, 229, 0.08);
      color: var(--accent-admin);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .welcome-clock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding: 20px 10px;
      gap: 12px;
    }

    .live-date {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent-admin);
      text-align: center;
      line-height: 1.3;
      letter-spacing: -0.01em;
      padding: 10px 0;
    }

    .welcome-message {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 9999px;
    }

    .shield-icon {
      width: 14px;
      height: 14px;
      color: var(--accent-admin);
    }

    /* Right Pane - Login Form Card */
    .form-pane {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .login-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: 24px;
      padding: 28px 32px;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 45px rgba(27, 44, 110, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 4px;
    }

    .logo-container img {
      height: 46px;
      width: auto;
      filter: drop-shadow(0 2px 8px rgba(27, 44, 110, 0.06));
    }

    .form-header {
      text-align: center;
    }

    .form-header h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      color: var(--navy);
      font-weight: 900;
      letter-spacing: -0.01em;
      margin-bottom: 2px;
    }

    .form-header h3 {
      font-size: 0.9rem;
      color: var(--accent-admin);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .login-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg.field-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.25s;
    }

    .input-wrapper input {
      width: 100%;
      padding: 10px 40px;
      background: rgba(255, 255, 255, 0.8);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: var(--text);
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--accent-admin);
      box-shadow: 0 0 0 4px rgba(var(--accent-admin-rgb), 0.1);
      background: var(--white);
    }

    .input-wrapper input:focus+svg.field-icon {
      color: var(--accent-admin);
    }

    /* Password visibility toggle */
    .password-toggle {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }

    .password-toggle:hover {
      color: var(--navy);
      background: rgba(27, 44, 110, 0.05);
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
    }

    /* Forgot Password align */
    .forgot-link-wrapper {
      display: flex;
      justify-content: flex-end;
      margin-top: -6px;
    }

    .forgot-link {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: var(--navy);
    }

    /* Form Submit Button */
    .submit-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(190, 18, 60, 0.2);
      transition: background 0.25s, box-shadow 0.25s, transform 0.2s;
    }

    .submit-btn:hover {
      box-shadow: 0 6px 20px rgba(190, 18, 60, 0.35);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    /* Card Footer Link */
    .card-footer {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 4px;
    }

    .card-footer a {
      color: var(--accent-admin);
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s;
    }

    .card-footer a:hover {
      color: var(--navy);
      text-decoration: underline;
    }

    /* Responsive adjustments */
    @media (max-width: 960px) {
      body {
        overflow-y: hidden;
        height: 100%;
        justify-content: center;
        padding: 0;
      }

      .split-container {
        grid-template-columns: 1fr;
        height: auto;
        max-width: 440px;
        margin: 0 auto;
        padding: 0 16px;
      }

      .display-pane {
        display: none !important;
      }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
      }

      .display-pane {
        padding: 24px 20px;
      }

      .back-home-btn {
        padding: 8px 12px;
        font-size: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

  <div class="ambient-glow-1"></div>

  <header class="top-nav">

        <div class="welcome-clock-container">

  <script>
    // 1. Password Visibility Toggle
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleButton.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);

      if (type === 'text') {
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
          <line x1="1" y1="1" x2="23" y2="23" />
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
          <circle cx="12" cy="12" r="3" />
        `;
      }
    });

    // 2. Interactive particle background canvas
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null, radius: 120 };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.size = Math.random() * 2 + 1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

        if (mouse.x !== null && mouse.y !== null) {
          let dx = mouse.x - this.x;
          let dy = mouse.y - this.y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < mouse.radius) {
            let force = (mouse.radius - dist) / mouse.radius;
            this.x -= dx / dist * force * 0.5;
            this.y -= dy / dist * force * 0.5;
          }
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(27, 44, 110, 0.12)';
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const count = Math.min(50, Math.floor((canvas.width * canvas.height) / 30000));
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          let dx = particles[i].x - particles[j].x;
          let dy = particles[i].y - particles[j].y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = 'rgba(27, 44, 110, ' + (0.06 * (1 - dist / 120)) + ')';
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseout', () => {
      mouse.x = null;
      mouse.y = null;
    });

    // 3. Dynamic Welcome Date Greeting
    function updateClock() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('liveDate').textContent = now.toLocaleDateString(undefined, options);
    }

    resizeCanvas();
    animate();
    updateClock();
    setInterval(updateClock, 60000);
  </script>
</body>

</html>
